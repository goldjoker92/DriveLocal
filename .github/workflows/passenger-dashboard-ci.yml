name: Passenger dashboard CI

on:
  pull_request:
    paths:
      - 'src/app/(passenger)/**'
      - 'src/components/AppButton.jsx'
      - 'src/services/passengerService.js'
      - 'src/services/__tests__/passengerDashboardContract.test.js'
      - 'src/utils/clientRideLog.js'
      - 'src/utils/passengerDashboardPolicy.js'
      - 'src/utils/__tests__/passengerDashboardPolicy.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/passenger-dashboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run dashboard policy Jest test
        run: npx jest src/utils/__tests__/passengerDashboardPolicy.test.js --ci --runInBand --verbose

      - name: Run dashboard contract Jest test
        run: npx jest src/services/__tests__/passengerDashboardContract.test.js --ci --runInBand --verbose

      - name: Run full Jest suite
        id: full-jest
        continue-on-error: true
        run: npm test -- --json --outputFile=jest-results.json

      - name: Upload Jest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passenger-dashboard-jest-results
          path: jest-results.json
          if-no-files-found: warn
          retention-days: 3

      - name: Check whitespace errors
        if: always()
        run: git diff --check origin/${{ github.base_ref }}...HEAD

      - name: Enforce full Jest result
        if: steps.full-jest.outcome != 'success'
        run: exit 1
