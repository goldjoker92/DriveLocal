name: Passenger dashboard CI

on:
  pull_request:
    paths:
      - 'src/app/(passenger)/**'
      - 'src/components/AppButton.jsx'
      - 'src/services/passengerService.js'
      - 'src/services/__tests__/passengerDashboardContract.test.js'
      - 'src/utils/clientRideLog.js'
      - 'src/utils/passengerDashboardPolicy.js'
      - 'src/utils/__tests__/passengerDashboardPolicy.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/passenger-dashboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run dashboard policy Jest test
        run: npx jest src/utils/__tests__/passengerDashboardPolicy.test.js --ci --runInBand --verbose

      - name: Run dashboard contract Jest test
        run: npx jest src/services/__tests__/passengerDashboardContract.test.js --ci --runInBand --verbose

      - name: Run full Jest suite with diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee jest-full.log
          status=${PIPESTATUS[0]}
          echo "$status" > jest-exit-code.txt
          exit 0

      - name: Upload full Jest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passenger-dashboard-full-jest-log
          path: |
            jest-full.log
            jest-exit-code.txt
          if-no-files-found: error
          retention-days: 3

      - name: Check whitespace errors
        if: always()
        run: git diff --check origin/${{ github.base_ref }}...HEAD

      - name: Enforce full Jest result
        shell: bash
        run: test "$(cat jest-exit-code.txt)" = "0"
